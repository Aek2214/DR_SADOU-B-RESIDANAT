<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Cours & QCM</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

    <!-- En-tête -->
    <header>
        <h1>📚 Gestion des Cours & QCM</h1>
        <p>Ajoutez, supprimez et révisez vos cours et tests facilement.</p>
    </header>

    <!-- Section Cours -->
    <div class="section">
        <h2>🩺 Cours Médicaux</h2>
        <button class="toggle-button" onclick="toggleList('course-list')">➕ Ajouter un cours</button>
        <div class="scroll-box hidden" id="course-list">
            <ul id="existing-courses">
                <li>Neurologie <button onclick="addCourse(this)">✅ Ajouter</button></li>
                <li>Cardiologie <button onclick="addCourse(this)">✅ Ajouter</button></li>
                <li>Pneumologie <button onclick="addCourse(this)">✅ Ajouter</button></li>
            </ul>
            <input type="text" id="new-course" placeholder="Ajouter un cours">
            <button onclick="addNewCourse()">📌 Ajouter Nouveau</button>
        </div>
        <h3>📖 Cours Révisés :</h3>
        <ul id="revised-courses"></ul>
    </div>

    <!-- Section QCM -->
    <div class="section">
        <h2>📑 QCM</h2>
        <button class="toggle-button" onclick="toggleList('qcm-list')">➕ Ajouter un QCM</button>
        <div class="scroll-box hidden" id="qcm-list">
            <ul id="existing-qcms">
                <li>Cardiologie <button onclick="addQCM(this)">✅ Ajouter</button></li>
                <li>Neurologie <button onclick="addQCM(this)">✅ Ajouter</button></li>
                <li>Gastro-entérologie <button onclick="addQCM(this)">✅ Ajouter</button></li>
            </ul>
            <textarea id="new-qcm" placeholder="Coller un QCM"></textarea>
            <button onclick="addNewQCM()">📝 Ajouter Nouveau</button>
        </div>
        <h3>📚 QCM Sélectionnés :</h3>
        <ul id="selected-qcms"></ul>
    </div>

</body>
</html>
